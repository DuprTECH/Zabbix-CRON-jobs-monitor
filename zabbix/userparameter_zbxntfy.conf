# zbxntfy: cron job discovery for template "Cron jobs by zbxntfy".
# Copy to /etc/zabbix/zabbix_agent2.d/ (agent 2) or /etc/zabbix/zabbix_agentd.d/ (agent) and restart the agent.
#
# User crontabs (/var/spool/cron) are readable only by root. Either:
#   a) setcap cap_dac_read_search+ep /usr/local/bin/zbxntfy-discovery   (recommended, no sudo log noise)
#   b) use the sudo variant below together with sudoers.d/zbxntfy
UserParameter=zbxntfy.jobs,/usr/local/bin/zbxntfy-discovery
#UserParameter=zbxntfy.jobs,sudo -n /usr/local/bin/zbxntfy-discovery
