version: 2
project_name: zbxntfy

before:
  hooks:
    - go test ./...

builds:
  - id: zbxntfy
    main: ./cmd/zbxntfy
    binary: zbxntfy
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: zbxntfy-discovery
    main: ./cmd/zbxntfy-discovery
    binary: zbxntfy-discovery
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: zbxntfy-wrap
    main: ./cmd/zbxntfy-wrap
    binary: zbxntfy-wrap
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    # stable name -> https://github.com/<repo>/releases/latest/download/zbxntfy_linux_amd64.tar.gz
    name_template: "zbxntfy_linux_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - zabbix/**/*

nfpms:
  - package_name: zbxntfy
    vendor: DuprTECH
    homepage: https://github.com/DuprTECH/Zabbix-CRON-jobs-monitor
    maintainer: DuprTECH
    license: MIT
    description: Cron job monitoring for Zabbix (discovery via agent, results via zabbix_sender).
    formats: [deb, rpm]
    file_name_template: "{{ .PackageName }}_linux_{{ .Arch }}"
    bindir: /usr/bin
    dependencies:
      - zabbix-sender
    overrides:
      deb:
        recommends: [libcap2-bin]
      rpm:
        recommends: [libcap]
    contents:
      - src: packaging/userparameter_zbxntfy.conf
        dst: /usr/share/zbxntfy/userparameter_zbxntfy.conf
      - src: zabbix/template_cron_jobs_zbxntfy.yaml
        dst: /usr/share/zbxntfy/template_cron_jobs_zbxntfy.yaml
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
